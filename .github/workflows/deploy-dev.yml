# Existing DEV build/test flow; AWS registry and deployment destination.
# Migration branch uses aws-dev. Existing main/dev stays untouched until cutover.
name: Deploy DEV (QA MCP)
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true
      commit:
        description: Optional commit hash (leave empty to deploy selected branch HEAD)
        required: false
concurrency:
  group: qa-mcp-dev
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/migration/aws-dev' && 'aws-dev' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Validate confirmation (manual only)
      if: github.event_name == 'workflow_dispatch'
      run: |
        if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
          echo "❌ Deployment cancelled. Type 'deploy' to confirm."
          exit 1
        fi
        echo "✅ Deployment confirmed"
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit || github.ref }}
        persist-credentials: false
    - name: Resolve the selected source and immutable ECR release
      id: release
      shell: bash
      run: |
        sha=$(git rev-parse HEAD)
        [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
        release_id="$sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$release_id" >> "$GITHUB_OUTPUT"
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Build
      run: npm run build
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Authenticate to AWS ECR (publish)
      uses: aws-actions/configure-aws-credentials@ce2ec50a23cfb8aacf5544bea7a651d803d626f6
      with:
        role-to-assume: ${{ vars.ECR_PUBLISH_ROLE_ARN }}
        unset-current-credentials: true
        aws-region: eu-central-1
        allowed-account-ids: '649089875282'
    - name: Log in to Amazon ECR
      shell: bash
      run: |
        aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.release.outputs.image }}
        cache-from: type=gha,scope=qa-mcp-dev
        cache-to: type=gha,mode=max,scope=qa-mcp-dev
        platforms: linux/amd64
        provenance: false
        labels: |
          org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
      id: image
    env:
      ECR_REGISTRY: 649089875282.dkr.ecr.eu-central-1.amazonaws.com
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.release.outputs.sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      image_digest: ${{ steps.image.outputs.digest }}
  deploy:
    name: Deploy DEV to AWS
    needs: build
    environment: ${{ github.ref == 'refs/heads/migration/aws-dev' && 'aws-dev' || 'dev' }}
    runs-on:
    - self-hosted
    - linux
    - x64
    - sa-dev-qa-mcp-ci
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout the deployment connection code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: ${{ github.sha }}
    - name: Authenticate to AWS ECR (pull)
      uses: aws-actions/configure-aws-credentials@ce2ec50a23cfb8aacf5544bea7a651d803d626f6
      with:
        role-to-assume: ${{ vars.ECR_PULL_ROLE_ARN }}
        unset-current-credentials: true
        aws-region: eu-central-1
        allowed-account-ids: '649089875282'
    - name: Verify the exact image published by the build
      shell: bash
      env:
        ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        RELEASE_ID: ${{ needs.build.outputs.release_id }}
        SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        EXPECTED_DIGEST: ${{ needs.build.outputs.image_digest }}
      run: |
        python3 - <<'PY'
        import os, re, boto3
        sha = os.environ['SOURCE_SHA']
        release = os.environ['RELEASE_ID']
        expected = os.environ['EXPECTED_DIGEST']
        assert re.fullmatch(r'[0-9a-f]{40}', sha)
        assert re.fullmatch(re.escape(sha) + r'-[0-9]+-[0-9]+', release)
        assert re.fullmatch(r'sha256:[0-9a-f]{64}', expected)
        actual = boto3.client('ecr', region_name='eu-central-1').describe_images(
            repositoryName=os.environ['ECR_REPOSITORY'], imageIds=[{'imageTag': release}])['imageDetails'][0]['imageDigest']
        assert actual == expected
        print('Verified the exact immutable image from the hosted build')
        PY
    - name: Deploy to AWS using the existing restricted SSH connection
      if: vars.AWS_DEV_DEPLOY_ENABLED == 'true' && vars.AWS_DEV_CREDENTIALS_ENROLLED == 'true'
      env:
        DEPLOY_RELEASE_ID: ${{ needs.build.outputs.release_id }}
        DEPLOY_HOST: 127.0.0.1
        DEPLOY_USER: deploy-sa-dev-qa-mcp
        DEPLOY_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_KNOWN_HOSTS }}
        DEPLOY_SSH_KEY: ${{ contains(fromJSON(vars.AWS_DEV_RUNTIME_SECRET_NAMES || '[]'), 'DEPLOY_SSH_KEY') && secrets.DEPLOY_SSH_KEY
          || '' }}
        RUNTIME_ALLOWED_SECRET_NAMES: ${{ vars.AWS_DEV_RUNTIME_SECRET_NAMES }}
        EVIDENCE_DEV_BACKEND_TOKEN: ${{ contains(fromJSON(vars.AWS_DEV_RUNTIME_SECRET_NAMES || '[]'), 'EVIDENCE_DEV_BACKEND_TOKEN')
          && secrets.EVIDENCE_DEV_BACKEND_TOKEN || '' }}
        EVIDENCE_DEV_BACKEND_URL: ${{ vars.EVIDENCE_DEV_BACKEND_URL }}
        EVIDENCE_DEV_DATABASE_URL: ${{ contains(fromJSON(vars.AWS_DEV_RUNTIME_SECRET_NAMES || '[]'), 'EVIDENCE_DEV_DATABASE_URL')
          && secrets.EVIDENCE_DEV_DATABASE_URL || '' }}
        HOME: ${{ vars.HOME }}
        MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS }}
        MCP_HOST: ${{ vars.MCP_HOST }}
        MCP_PORT: ${{ vars.MCP_PORT }}
        MCP_TOKEN: ${{ contains(fromJSON(vars.AWS_DEV_RUNTIME_SECRET_NAMES || '[]'), 'MCP_TOKEN') && secrets.MCP_TOKEN
          || '' }}
        MCP_TRANSPORT: ${{ vars.MCP_TRANSPORT }}
        PROMOTION_DEV_BACKEND_TOKEN: ${{ contains(fromJSON(vars.AWS_DEV_RUNTIME_SECRET_NAMES || '[]'), 'PROMOTION_DEV_BACKEND_TOKEN')
          && secrets.PROMOTION_DEV_BACKEND_TOKEN || '' }}
        PROMOTION_DEV_DATABASE_URL: ${{ contains(fromJSON(vars.AWS_DEV_RUNTIME_SECRET_NAMES || '[]'), 'PROMOTION_DEV_DATABASE_URL')
          && secrets.PROMOTION_DEV_DATABASE_URL || '' }}
        PYTHONDONTWRITEBYTECODE: ${{ vars.PYTHONDONTWRITEBYTECODE }}
        QA_DATABASE_CA_CERT_B64: ${{ vars.QA_DATABASE_CA_CERT_B64 }}
        QA_DATABASE_TLS_VERIFY_FULL: ${{ vars.QA_DATABASE_TLS_VERIFY_FULL }}
        QA_RUNNER_TOKEN: ${{ contains(fromJSON(vars.AWS_DEV_RUNTIME_SECRET_NAMES || '[]'), 'QA_RUNNER_TOKEN') &&
          secrets.QA_RUNNER_TOKEN || '' }}
        QA_RUNNER_URL: ${{ vars.QA_RUNNER_URL }}
      run: python3 .delivery/pipeline.py deploy .delivery/project.json
